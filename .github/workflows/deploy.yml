name: Build check (archived Hexo, root=/old/)

# This repo is the archived Hexo site. It is NOT published on its own Pages:
# the main site repo (BOHUYESHAN-APB.github.io) checks out this repo, builds it
# with root=/old/ and composes the output into /old/ on bohuyeshan.top.
# This workflow only validates that the archive still builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static files (root=/old/)
        run: npx hexo generate

      - name: Sanity check /old/ root
        run: |
          test -f public/index.html
          grep -q "/old/" public/2026/index.html || true
